name: Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example v0.1.0 or v0.2.0-rc.1'
        required: true
        default: 'v0.1.0-ci.1'
        type: string
      publish_release:
        description: 'Create/update the GitHub Release (otherwise artifact only)'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: voicepilot-release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  build-windows:
    name: Test and publish Windows x64
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve release version
        id: release
        shell: pwsh
        env:
          VOICEPILOT_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          $version = $env:VOICEPILOT_VERSION.Trim()
          if ($version -notmatch '^v\d+\.\d+\.\d+(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$') {
            throw "Version must be vMAJOR.MINOR.PATCH with an optional SemVer prerelease: $version"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "prerelease=$($version.Contains('-').ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Restore test dependencies
        shell: pwsh
        run: dotnet restore tests/VoicePilot.Tests/VoicePilot.Tests.csproj --nologo

      - name: Run core tests
        shell: pwsh
        run: dotnet test tests/VoicePilot.Tests/VoicePilot.Tests.csproj --configuration Release --no-restore --nologo

      - name: Restore Windows publish dependencies
        shell: pwsh
        run: dotnet restore src/VoicePilot.App/VoicePilot.App.csproj --runtime win-x64 --nologo

      - name: Publish self-contained application and ZIP
        shell: pwsh
        env:
          VOICEPILOT_VERSION: ${{ steps.release.outputs.version }}
        run: ./scripts/publish-windows.ps1 -Version $env:VOICEPILOT_VERSION -Architecture x64

      - name: Generate release notes
        shell: pwsh
        env:
          VOICEPILOT_VERSION: ${{ steps.release.outputs.version }}
        run: |
          $version = $env:VOICEPILOT_VERSION
          $commitUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/commit/$env:GITHUB_SHA"
          $notes = @"
          ## VoicePilot $version (Windows x64)

          ### 安装运行
          1. 下载 `VoicePilot-$version-win-x64.zip` 并完整解压。
          2. 在解压目录运行 `VoicePilot.exe`，不要只复制 EXE。
          3. 包内已包含 .NET 10 和 Windows App SDK 自包含组件，无需另装 .NET Runtime。
          4. 若系统缺少组件，请安装当前受支持的 Microsoft Visual C++ Redistributable。

          ### 验证范围
          - GitHub Actions 已执行核心自动化测试和 Windows x64 Release 构建。
          - 当前版本未进行代码签名，Windows 可能显示 SmartScreen 提示。
          - 默认仅采集音频；真实识别/翻译需要后续后端协议，模拟文本不是真实识别。
          - CI 构建不等同于 Windows 11 实机麦克风、Loopback、性能和长稳验收。
          - 源代码：[$env:GITHUB_SHA]($commitUrl)

          完整校验值见 `SHA256SUMS.txt`。
          "@
          $notes | Set-Content -Path artifacts/release/RELEASE_NOTES.md -Encoding utf8

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoicePilot-${{ steps.release.outputs.version }}-win-x64
          path: |
            artifacts/release/*.zip
            artifacts/release/SHA256SUMS.txt
            artifacts/release/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: ${{ github.event_name == 'push' || inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.version }}
          name: VoicePilot ${{ steps.release.outputs.version }}
          body_path: artifacts/release/RELEASE_NOTES.md
          prerelease: ${{ steps.release.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            artifacts/release/*.zip
            artifacts/release/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ github.token }}
